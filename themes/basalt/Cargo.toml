[package]
name = "rune-basalt"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Basalt: a dark, mono-and-grotesk design system for desktop software built with Rune: tokens, type, components and charts."

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }

[dev-dependencies]
rune = { workspace = true, default-features = true }
