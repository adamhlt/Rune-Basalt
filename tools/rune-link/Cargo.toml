[package]
name = "rune-link"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Imports Rune into this repo, or connects the repo to an existing Rune workspace (`cargo rune …`)."

# Its own workspace root, so it builds whether or not the repo has imported Rune.
[workspace]

[dependencies]
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
junction = "1"
